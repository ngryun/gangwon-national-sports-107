<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>강원 전국체전 경기일정</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--sub:#5d6875;--line:#e3e7ec;--accent:#0b6e4f;--accent-soft:#e3f2ec;--warn:#b45309;--warn-soft:#fdf1e3;--lose:#b42318;--lose-soft:#fdecea;--past:#9aa3ad;--chip:#eef1f4;--today:#d97706;--gold:#a16207;--silver:#64748b;--rec:#3b5bdb;--rec-soft:#e7ecfd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161c;--card:#1a2129;--ink:#e6ebf0;--sub:#9aa6b2;--line:#2a333d;--accent:#3ccf98;--accent-soft:#163a2e;--warn:#f0a35a;--warn-soft:#3a2a17;--lose:#f87171;--lose-soft:#3b1d1d;--past:#5f6a75;--chip:#232c36;--today:#f59e0b;--gold:#facc15;--silver:#cbd5e1;--rec:#8ea2ff;--rec-soft:#1f2747;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161c;--card:#1a2129;--ink:#e6ebf0;--sub:#9aa6b2;--line:#2a333d;--accent:#3ccf98;--accent-soft:#163a2e;--warn:#f0a35a;--warn-soft:#3a2a17;--lose:#f87171;--lose-soft:#3b1d1d;--past:#5f6a75;--chip:#232c36;--today:#f59e0b;--gold:#facc15;--silver:#cbd5e1;--rec:#8ea2ff;--rec-soft:#1f2747;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.45}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header h1{font-size:22px;margin:0}
header h1 small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.meet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 0;font-size:13px;color:var(--sub)}
.meet .dday{background:var(--accent);color:var(--card);border-radius:6px;padding:1px 8px;font-weight:700}
.gw{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}
.gw .rk{display:flex;align-items:baseline;gap:6px}
.gw .rk b{font-size:22px}
.gw .rk span,.gw .md span{color:var(--sub);font-size:12px}
.gw .md{display:flex;gap:10px;align-items:baseline}
.gw .md i{font-style:normal;font-weight:700;font-size:16px}
.gw .md .g{color:var(--gold)}.gw .md .s{color:var(--silver)}.gw .md .b{color:var(--warn)}
.gw small{color:var(--sub);font-size:12px;margin-left:auto}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px}
.stat b em{font-style:normal;font-size:13px;font-weight:600;color:var(--sub)}
.stat span{color:var(--sub);font-size:12px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.day:hover{border-color:var(--accent)}
.day.past{opacity:.55}
.cal.has-sel .day:not(.sel){opacity:.45}
.cal.has-sel .day:not(.sel):hover{opacity:.8}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--card);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.day.sel .wd,.day.sel .pre,.day.sel .sub,.day.sel .wl,.day.sel .tag,.day.sel .n b{color:inherit}
.day.sel .bar{background:color-mix(in srgb,var(--card) 30%,transparent)}
.day.sel .bar i{background:var(--card)}
.day .ck{display:none;float:right;font-size:11px;font-weight:700}
.day.sel .ck{display:inline}
.day.today{border-color:var(--today)}
.day .dt{font-weight:700;font-size:15px}
.day .wd{color:var(--sub);font-size:12px;margin-left:4px}
.day .pre{font-size:11px;color:var(--sub);margin-left:4px}
.day .n{font-size:12px;margin-top:4px}
.day .n b{color:var(--accent);font-size:16px}
.day .wl{font-size:11px;color:var(--sub);margin-top:2px}
.day .bar{height:5px;background:var(--chip);border-radius:3px;margin-top:6px;overflow:hidden}
.day .bar i{display:block;height:100%;background:var(--accent)}
.day .tag{font-size:11px;color:var(--today);font-weight:700}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.fl{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=search]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;max-width:100%}
input[type=search]{flex:1;min-width:160px}
button.ghost{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit}
.count{color:var(--sub);font-size:13px;margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.count .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--card);border:0;border-radius:999px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer}
.count .chip:hover{filter:brightness(1.1)}
.group h3{font-size:14px;margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.group h3 small{color:var(--sub);font-weight:400}
.list{display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:110px 1fr auto;gap:4px 14px;align-items:start}
.item.past{border-left-color:var(--past)}
.item.later{border-left-color:var(--warn)}
.item.won{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),var(--card) 40%)}
.item.lost{border-left-color:var(--lose)}
.item.rec{border-left-color:var(--rec)}
.item.rec.past{border-left-color:var(--past)}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.time s{display:block;font-weight:400;color:var(--sub);font-size:11px}
.ev{font-weight:700}
.item>div{min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ev .sp{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:6px}
.who{margin-top:2px}
.who b{font-weight:700}
.vs{color:var(--sub)}
.meta{color:var(--sub);font-size:12px;margin-top:3px}
.meta a{text-decoration:none;white-space:nowrap}
.meta a:hover{text-decoration:underline}
.path{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.path span{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--sub)}
.path span.on{outline:1.5px solid var(--accent);color:var(--ink);font-weight:600}
.path span.w{background:var(--accent-soft);color:var(--accent)}
.path span.l{background:var(--lose-soft);color:var(--lose)}
.path span.x{text-decoration:line-through;opacity:.6}
.path span.c{box-shadow:inset 0 0 0 1px var(--warn)}
.rnd{font-size:12px;white-space:nowrap;color:var(--sub);text-align:right}
.rnd b{display:block;color:var(--ink);font-size:13px}
.badge{display:inline-block;font-size:11px;border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:0 5px;margin-left:4px;font-weight:600;vertical-align:1px}
.badge.w{border-color:var(--accent);background:var(--accent);color:#fff}
.badge.l{border-color:var(--lose);background:var(--lose);color:#fff}
.badge.chg{background:var(--warn-soft)}
.badge.medal{border-color:var(--gold);color:var(--gold)}
.badge.exp{border-style:dashed;border-color:var(--gold);color:var(--gold);font-weight:500}
.badge.rec{border-color:var(--rec);color:var(--rec)}
.ev .sp.r{background:var(--rec-soft);color:var(--rec)}
.evl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.evl li{display:grid;grid-template-columns:44px 1fr auto;gap:2px 8px;font-size:12.5px;padding:4px 0;border-top:1px dashed var(--line)}
.evl li:first-child{border-top:0}
.evl .et{color:var(--sub);font-variant-numeric:tabular-nums}
.evl .en small{color:var(--sub)}
.evl .es{color:var(--sub);font-size:11px}
.evl .er{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.rr{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px}
.rr.g{background:var(--gold);color:var(--card)}.rr.s{background:var(--silver);color:var(--card)}.rr.b{background:var(--warn);color:var(--card)}
.nr{color:var(--sub);font-size:12px}
details summary{cursor:pointer;color:var(--sub);font-size:12px;margin-top:6px}
.badge.rk{border-color:var(--sub);color:var(--sub)}
.badge.rk.g{border-color:var(--gold);background:var(--gold);color:var(--card)}
.badge.rk.s{border-color:var(--silver);background:var(--silver);color:var(--card)}
.badge.rk.b{border-color:var(--warn);background:var(--warn);color:var(--card)}
.pl{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.day .sub{font-size:11px;color:var(--sub);margin-top:2px}
.res{font-weight:700;font-variant-numeric:tabular-nums}
.res.w{color:var(--accent)}.res.l{color:var(--lose)}
.empty{padding:30px;text-align:center;color:var(--sub)}
footer{margin-top:30px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
footer code{background:var(--chip);border-radius:4px;padding:0 4px}
@media (max-width:640px){
  .wrap{padding-block:12px 40px}
  header h1{font-size:19px}
  .gw{padding:8px 12px;gap:6px 14px}
  .gw .rk b{font-size:19px}
  .gw .md i{font-size:15px}
  .gw small{margin-left:0;width:100%}
  /* 통계·날짜·필터는 한 줄 가로 스크롤 */
  .stats,.cal,.fl{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-16px;padding-inline:16px}
  .stats::-webkit-scrollbar,.cal::-webkit-scrollbar,.fl::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;min-width:0;padding:6px 12px}
  .stat b{font-size:17px}
  .cal{gap:6px;padding-bottom:2px}
  .day{flex:0 0 76px;padding:8px}
  .day .dt{font-size:14px}
  .day .wd{margin-left:2px}
  .day .ck{display:none!important}
  .controls{padding:8px 0;gap:6px}
  input[type=search]{flex:1 1 100%;font-size:16px;padding:8px 10px}
  .fl{gap:6px;width:calc(100% + 32px)}
  .fl select,.fl button{flex:0 0 auto;font-size:16px;padding:6px 8px}
  .group h3{margin:14px 0 6px}
  .item{grid-template-columns:1fr;position:relative;padding:10px 12px;gap:2px}
  .time{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding-right:64px}
  .time small,.time s{display:inline}
  .rnd{position:absolute;top:10px;right:12px;text-align:right}
  .rnd b{font-size:12px}
  .path span{font-size:11px;padding:1px 6px}
  .evl li{grid-template-columns:40px 1fr auto}
}
@media print{.controls{position:static}.day{break-inside:avoid}.item{break-inside:avoid}}
</style>
</head>
<body>

<div class="wrap">
<header>
<h1>강원 경기일정 <small>제107회 전국체전</small></h1>
<div class="meet" id="meet"></div>
<div class="gw" id="gw"></div>
</header>
<div class="stats" id="stats"></div>
<div class="cal" id="cal"></div>

<div class="controls">
<input type="search" id="fQ" placeholder="선수·학교·경기장 검색" aria-label="검색">
<div class="fl">
<select id="fView" aria-label="보기 방식">
<option value="cur">현재 단계</option>
<option value="first">첫 경기만</option>
<option value="all">전체 경로</option>
</select>
<select id="fType" aria-label="경기 방식">
<option value="">토너먼트+기록</option>
<option value="tour">토너먼트</option>
<option value="rec">기록 종목</option>
</select>
<select id="fSport" aria-label="종목"><option value="">전체 종목</option></select>
<select id="fAge" aria-label="부"><option value="">전체 부</option><option>18세이하부</option><option>대학부</option><option>일반부</option></select>
<select id="fGender" aria-label="성별"><option value="">남·여</option><option>남자</option><option>여자</option><option>혼성/공통</option></select>
<select id="fStatus" aria-label="상태">
<option value="">전체 상태</option>
<option value="alive">진행 중</option>
<option value="done">결과 나옴</option>
<option value="out">탈락·종료</option>
<option value="chg">일정 변경</option>
</select>
<button class="ghost" id="reset">초기화</button>
</div>
</div>
<div class="count" id="count"></div>
<div id="out"></div>

<footer>
자료: <a href="https://meet.sports.or.kr/national/main.do" target="_blank" rel="noopener">대한체육회 공식 홈페이지</a>, 대진추첨 원문, ‘오늘의 경기’ · <span id="asof"></span><br>
<span class="badge chg">변경</span> 공식 일정으로 고친 경기 · 메달 색은 최종 순위 1~3위 · 최종 일정은 대회 공식 안내로 확인
</footer>
</div>

const LEFT=[];
REC.forEach(x=>{
  const hits=CARDS.filter(c=>daysOf(c,0).includes(x.p[0].d)&&c.a===x.a&&sbase(c.s).startsWith(sbase(x.s))&&(x.g==='혼성/공통'||c.g==='혼성/공통'||c.g===x.g));
  if(hits.length)hits.forEach(c=>c.pdf.push(x));else LEFT.push(x);
});
function medalSum(){
  const seen=new Set(),sum={금:0,은:0,동:0};
  const add=(key,m)=>{if(!m||seen.has(key))return;seen.add(key);(m.match(/[금은동]\d+/g)||[]).forEach(t=>sum[t[0]]+=Number(t.slice(1)))};
  DATA.forEach(r=>add(r.s+r.g+r.a+r.e,r.em));
  // 같은 예상메달이 예선·결승 행이나 여러 날짜에 반복 적혀 있으므로, 이름이 붙은 메달은 종목 안에서 한 번만, 나머지는 라운드 표기를 뺀 세부종목별로 한 번만 센다
  REC.forEach(r=>{
    if(!r.em)return;
    const toks=r.em.split(/,\s*/).sort().join(',');
    add(/\((?!단체)/.test(r.em)?r.s+'|'+toks:[r.s,r.k,r.e.replace(/\(.*?\)/g,'').replace(/\s/g,''),toks].join('|'),toks);
  });
  return sum;
}

// ---- 헤더: 대회 개요·강원 순위 ----
(function(){
  const t=dnum(TODAY),s=dnum(MEET_START),e=dnum(MEET_END);
  const dd=t<s?`D-${s-t}`:(t<=e?`${t-s+1}일차`:'대회 종료');
  $('meet').innerHTML=`<span class="dday">${dd}</span><span>10.16(금)~22(목) · 제주</span>`;
  const g=OFF.gw||{},at=OFF.at?OFF.at.slice(5).replace('-','/'):'';
  const md=(label,m)=>`<div class="md"><span>${label}</span><i class="g">금${esc(m[0])}</i><i class="s">은${esc(m[1])}</i><i class="b">동${esc(m[2])}</i></div>`;
  let h='';
  if(g.rank)h+=`<div class="rk"><b>${esc(g.rank)}위</b><span>${esc(g.score||'')}점</span></div>`;
  if(g.medal)h+=md('메달',g.medal);
  const ms=medalSum();
  if(ms.금+ms.은+ms.동)h+=md('예상',[ms.금,ms.은,ms.동]);
  if(h&&at)h+=`<small>${esc(at)} 기준</small>`;
  if(h)$('gw').innerHTML=h;else $('gw').remove();
  if(at)$('asof').textContent=`${at} 갱신`;
})();

// ---- 필터 ----
const sports=[...new Set([...DATA,...CARDS,...LEFT].map(r=>r.s))].sort((a,b)=>a.localeCompare(b,'ko'));
sports.forEach(s=>{const o=document.createElement('option');o.textContent=s;o.value=s;$('fSport').appendChild(o)});

function filtered(){
  const s=$('fSport').value,a=$('fAge').value,g=$('fGender').value,q=$('fQ').value.trim().toLowerCase(),ty=$('fType').value;
  const ok=r=>(!s||r.s===s)&&(!a||r.a===a)&&(!g||r.g===g);
  const tour=ty==='rec'?[]:DATA.filter(r=>ok(r)&&(!q||[r.s,r.e,r.tm,r.v,r.pl,r.o.join(' '),r.a,r.g,...r.p.map(p=>p.opp+' '+(p.v||''))].join(' ').toLowerCase().includes(q)));
  const words=r=>r.card?[r.s,r.k,...r.v,...r.ev.flatMap(o=>[o.e,o.r,...(o.res||[]).map(x=>x[1]+' '+x[4])]),...r.pdf.map(x=>x.pl)]:[r.s,r.k,r.e,r.v,r.pl];
  const rec=ty==='tour'?[]:[...CARDS,...LEFT].filter(r=>ok(r)&&(!q||words(r).join(' ').toLowerCase().includes(q)));
  return {tour,rec};
}
function entries({tour:rows,rec}){
  const view=$('fView').value,st=$('fStatus').value;
  let ent=[];
  rows.forEach(r=>{
    if(view==='all')r.p.forEach((p,i)=>{if(!isDead(r,i))ent.push([r,i])});
    else ent.push([r,view==='cur'?r.cur:0]);
  });
  if(st==='alive')ent=ent.filter(([r])=>r.out<0&&!r.medal);
  if(st==='out')ent=ent.filter(([r])=>r.out>=0||r.medal);
  if(st==='done')ent=ent.filter(([r,i])=>r.p[i].res);
  if(st==='chg')ent=ent.filter(([r,i])=>r.p[i].chg);
  // 기록 종목 카드: '결과 나온 경기'는 종료된 경기가 있는 카드, '진행 중'은 남은 경기가 있는 카드
  rec.forEach(r=>{if(!st||(r.card&&(st==='done'&&r.done>0||st==='alive'&&r.done<r.ev.length)))ent.push([r,0])});
  return ent;
}
function stats({tour:rows,rec}){
  const steps=rows.flatMap(r=>r.p);
  const w=steps.filter(p=>p.res==='W').length,l=steps.filter(p=>p.res==='L').length;
  const alive=rows.filter(r=>r.out<0&&!r.medal).length;
  const chg=steps.filter(p=>p.chg).length;
  $('stats').innerHTML=[
    [`${w}승 <em>${l}패</em>`,'토너먼트'],
    [alive,'진행 중'],
    [rec.reduce((n,r)=>n+(r.top?r.top.length:0),0),'기록 1~3위'],
    [chg,'일정 변경']
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
}
function cal(ent){
  const cnt={},wl={},rc={};
  ent.forEach(([r,i])=>{const p=r.p[i];daysOf(r,i).forEach(d=>{cnt[d]=(cnt[d]||0)+1;if(r.rec)rc[d]=(rc[d]||0)+1});if(p.res){wl[p.d]=wl[p.d]||[0,0];wl[p.d][p.res==='W'?0:1]++}});
  const days=Object.keys(cnt).sort();const mx=Math.max(1,...Object.values(cnt));
  $('cal').classList.toggle('has-sel',!!selDay);
  $('cal').innerHTML=days.map(d=>`<button class="day ${d<TODAY?'past':''} ${d===TODAY?'today':''} ${selDay===d?'sel':''}" data-d="${d}" aria-pressed="${selDay===d}">
   <div><span class="ck">✓ 선택</span><span class="dt">${fmt(d)}</span><span class="wd">(${wd(d)})</span>${d<MEET_START?'<span class="pre">사전</span>':''} ${d===TODAY?'<span class="tag">오늘</span>':''}</div>
   <div class="n"><b>${cnt[d]}</b> 경기</div>
   ${wl[d]?`<div class="wl">${wl[d][0]}승 ${wl[d][1]}패</div>`:''}
   <div class="bar"><i style="width:${cnt[d]/mx*100}%"></i></div></button>`).join('')||'<div class="empty">해당 경기 없음</div>';
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selDay=selDay===b.dataset.d?null:b.dataset.d;render()});
  // 휴대폰에서 날짜 줄이 가로 스크롤일 때, 처음 열면 오늘(없으면 다음 경기일)로 옮긴다
  if(!cal.moved){cal.moved=true;const t=[...$('cal').children].find(b=>b.dataset.d>=TODAY);if(t)$('cal').scrollLeft=t.offsetLeft-$('cal').offsetLeft-16}
}
// '서귀포시 표선면 일원', '제주공동목장 내'처럼 범위를 뜻하는 꼬리말이 붙으면 지도 검색이 안 되므로 떼고 검색한다
const mapQ=s=>String(s||'').replace(/\s*(내\s*)?(일원|일대|인근|부근|주변)(\s*도로)?\s*$/,'').replace(/\s+내$/,'').trim()||s;
const mapLink=(v,ad)=>`<a href="https://map.naver.com/p/search/${encodeURIComponent(mapQ(ad||v))}" target="_blank" rel="noopener" title="${esc(ad||v)}">지도</a>`;
function recHTML(r){
  const p=r.p[0];
  return `<div class="item rec ${p.d<TODAY?'past':''}">
   <div class="time">${p.t?esc(p.t):'시간 미표기'}<small>${fmt(p.d)}(${wd(p.d)})</small></div>
   <div><div class="ev"><span class="sp r">${esc(r.s)}</span>${esc([r.k,r.e].filter(Boolean).join(' '))}${r.em?`<span class="badge exp">예상 ${esc(r.em)}</span>`:''}</div>
   ${r.pl?`<div class="pl">${esc(r.pl)}</div>`:''}
   <div class="meta">${esc(r.v)} ${r.v?mapLink(r.v,venueAddr[r.v]||''):''}</div></div>
   <div class="rnd"></div></div>`;
}
const RK=n=>n===1?'g':n===2?'s':n===3?'b':'';
function cardHTML(c){
  const p=c.p[0],all=c.done===c.ev.length;
  const rows=c.ev.map(o=>{
    const fin=FINAL.test(o.r);
    let res='';
    if(o.st==='종료')res=o.res==null?'<span class="nr">결과 조회 전</span>':!o.res.length?'<span class="nr">강원 기록 없음</span>':
      o.res.map(x=>`<span class="rr ${fin?RK(+x[0]):''}">${x[0]?esc(x[0])+(/^\d+$/.test(x[0])?'위':''):'-'} ${esc(x[1])}${x[2]?' <b>'+esc(x[2])+'</b>':''}${x[3]?' ('+esc(x[3])+')':''}</span>`).join('');
    return `<li class="${o.st==='종료'?'fin':''}"><span class="et">${c.d2&&!o.t1?fmt(o.d)+'~':esc(o.t1||'')}</span><span class="en">${esc(o.e)} <small>${esc(o.r)}</small></span><span class="es">${o.st==='종료'?'종료':''}</span>${res?`<div class="er">${res}</div>`:''}</li>`;
  }).join('');
  const top=c.top.slice().sort((a,b)=>a[0]-b[0]);
  const topB=top.slice(0,3).map(x=>`<span class="badge rk ${RK(x[0])}">${x[0]}위 ${esc(x[1])} · ${esc(x[2])}</span>`).join('')+(top.length>3?`<span class="badge rk">+${top.length-3}</span>`:'');
  const pl=[...new Set(c.pdf.map(x=>x.pl).filter(Boolean))],em=[...new Set(c.pdf.map(x=>x.em).filter(Boolean))];
  return `<div class="item rec ${top.length?'won':''} ${(c.d2||p.d)<TODAY&&!top.length?'past':''}">
   <div class="time">${p.t?esc(p.t):c.d2?'기간 경기':'시간 미표기'}<small>${fmt(p.d)}(${wd(p.d)})${c.d2?`~${fmt(c.d2)}(${wd(c.d2)})`:''}</small></div>
   <div><div class="ev"><span class="sp r">${esc(c.s)}</span>${esc(c.k)}${em.map(m=>`<span class="badge exp">예상 ${esc(m)}</span>`).join('')}${topB}</div>
   ${pl.length?`<div class="meta">출전 ${pl.map(esc).join(' · ')}</div>`:''}
   <div class="meta">${c.v.map(v=>esc(v)+' '+mapLink(v,venueAddr[v]||'')).join(' · ')}</div>
   <details${c.ev.length<=6?' open':''}><summary>${c.ev.length}경기</summary><ul class="evl">${rows}</ul></details></div>
   <div class="rnd">${all?'종료':c.done?`${c.done}/${c.ev.length} 종료`:''}</div></div>`;
}
function itemHTML(r,idx){
  if(r.card)return cardHTML(r);
  if(r.rec)return recHTML(r);
  const p=r.p[idx];const first=idx===0;
  const cls=p.res==='W'?'won':p.res==='L'?'lost':(p.d<TODAY?'past':(first||idx<=r.cur?'':'later'));
  const reached=idx<=r.cur||first;
  let opp;
  if(first&&r.o.length)opp=r.o.map(esc).join(', ')+(p.opp&&!r.o.some(x=>x.startsWith(p.opp))?` (${esc(p.opp)})`:'');
  else if(p.opp)opp=esc(p.opp);
  else opp='미정';
  const res=p.res?`<span class="res ${p.res==='W'?'w':'l'}">${p.res==='W'?'승':'패'}${p.sc?' '+esc(p.sc[0])+':'+esc(p.sc[1]):''}</span> `:'';
  const path=r.p.map((q,i)=>{
    const c=[i===idx?'on':'',q.res==='W'?'w':q.res==='L'?'l':'',isDead(r,i)?'x':'',q.chg?'c':''].join(' ');
    return `<span class="${c}" title="${q.chg?'원문 '+fmt(q.od)+(q.ot?' '+esc(q.ot):''):''}">${q.res==='W'?'✓ ':q.res==='L'?'✕ ':''}${rname(r,i)} ${fmt(q.d)}${q.t?' '+esc(tstart(q.t)):''}${q.n?' #'+esc(q.n):''}</span>`;
  }).join('');
  const v=p.v||r.v,ad=p.ad||venueAddr[v]||'';
  const tag=[
    r.b&&first?'<span class="badge">부전승</span>':'',
    !first&&!p.res&&idx>r.cur?'<span class="badge">진출 시</span>':'',
    p.chg?`<span class="badge chg" title="원문 ${fmt(p.od)}${p.ot?' '+esc(p.ot):''}">변경</span>`:'',
    p.chk?`<span class="badge" title="공식 후보일 ${p.chk.map(fmt).join(', ')}">확인 필요</span>`:'',
    r.medal&&(idx===r.p.length-1)?`<span class="badge medal">${r.medal}</span>`:'',
    r.em&&r.out<0?`<span class="badge exp" title="예상메달(오늘의 경기)">예상 ${esc(r.em)}</span>`:''
  ].join('');
  const status=isDead(r,idx)?'미진행':'';
  return `<div class="item ${cls}">
   <div class="time">${p.t?esc(p.t):'시간 미표기'}<small>${fmt(p.d)}(${wd(p.d)})${p.n?' #'+esc(p.n):''}</small>${p.chg?`<s>${fmt(p.od)}${p.ot?' '+esc(p.ot):''}</s>`:''}</div>
   <div><div class="ev"><span class="sp">${esc(r.s)}</span>${esc(r.g==='혼성/공통'?'':r.g)}${esc(r.a)} ${esc(r.e)}${tag}</div>
   <div class="who">${res}<b>강원 ${esc(r.tm)}</b> <span class="vs">vs</span> ${opp}</div>
   ${r.pl?`<div class="meta">출전 ${esc(r.pl)}</div>`:''}
   <div class="meta">${esc(v)} ${mapLink(v,ad)}${p.x?' · '+esc(p.x):''}</div>
   <div class="path">${path}</div></div>
   <div class="rnd"><b>${rname(r,idx)}</b>${status}</div></div>`;
}
function render(){
  const rows=filtered();stats(rows);
  let ent=entries(rows);cal(ent);
  if(selDay)ent=ent.filter(([r,i])=>daysOf(r,i).includes(selDay));
  ent.sort((A,B)=>{const a=A[0].p[A[1]],b=B[0].p[B[1]];return a.d.localeCompare(b.d)||(a.t||'99').localeCompare(b.t||'99')||A[0].s.localeCompare(B[0].s,'ko')});
  $('count').innerHTML=`<span>${ent.length}건 표시</span>${selDay?`<button class="chip" id="clearDay" title="날짜 선택 해제">${fmt(selDay)}(${wd(selDay)})만 보는 중 <span aria-hidden="true">✕</span><span class="vh">해제</span></button>`:''}`;
  if(selDay)$('clearDay').onclick=()=>{selDay=null;render()};
  const g={};ent.forEach(e=>{const d=selDay||e[0].p[e[1]].d;(g[d]=g[d]||[]).push(e)});
  $('out').innerHTML=Object.keys(g).sort().map(d=>`<div class="group"><h3>${fmt(d)} (${wd(d)}) ${d===TODAY?'<span style="color:var(--today)">· 오늘</span>':''}<small>${g[d].length}건</small></h3><div class="list">${g[d].map(([r,i])=>itemHTML(r,i)).join('')}</div></div>`).join('')||'<div class="empty">조건에 맞는 경기가 없습니다.</div>';
}
['fView','fType','fSport','fAge','fGender','fStatus'].forEach(id=>$(id).onchange=render);
$('fQ').oninput=render;
$('reset').onclick=()=>{['fType','fSport','fAge','fGender','fStatus'].forEach(id=>$(id).value='');$('fView').value='cur';$('fQ').value='';selDay=null;render()};
// 처음 열면 오늘 날짜를 선택해 둔다(오늘 경기가 없으면 다음 경기일, 대회가 끝났으면 선택 없음)
{const days=[...new Set(entries(filtered()).flatMap(([r,i])=>daysOf(r,i)))].sort();selDay=days.includes(TODAY)?TODAY:(days.find(d=>d>TODAY)||null)}
render();
</script>
